<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14"/>
      <stop offset="50%" style="stop-color:#1a1e2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#3b2a5a;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0a0e14;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#glowGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#a78bfa" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Decorative circles -->
  <g opacity="0.08">
    <circle cx="100" cy="60" r="120" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <circle cx="1100" cy="300" r="150" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="1050" cy="80" r="40" fill="#a78bfa"/>
    <circle cx="150" cy="290" r="25" fill="#8b5cf6"/>
    <circle cx="600" cy="350" r="60" fill="none" stroke="#a78bfa" stroke-width="0.8"/>
  </g>

  <!-- Decorative paths -->
  <g opacity="0.06" fill="none" stroke="#a78bfa">
    <path d="M0,200 Q300,150 600,200 T1200,180" stroke-width="1"/>
    <path d="M0,260 Q400,220 700,270 T1200,250" stroke-width="0.8"/>
    <path d="M-50,100 Q250,50 550,100 T1250,90" stroke-width="0.6"/>
  </g>

  <!-- Accent line above headline -->
  <line x1="350" y1="115" x2="850" y2="115" stroke="url(#accentLine)" stroke-width="2" opacity="0.7"/>

  <!-- Headline -->
  <text x="600" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="52.0" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="600" dy="0">Stable Diffusion 5</tspan>
    <tspan x="600" dy="58">Uncensored Client</tspan>
  </text>

  <!-- Accent line below headline -->
  <line x1="400" y1="260" x2="800" y2="260" stroke="url(#accentLine)" stroke-width="1.5" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9" text-anchor="middle">
    <tspan x="600" dy="0">SD5 client companion for artists and power users — manage</tspan>
    <tspan x="600" dy="30">uncensored checkpoints, VAE, and CFG presets without limits</tspan>
  </text>

  <!-- Bottom accent dots -->
  <g opacity="0.15">
    <circle cx="560" cy="335" r="3" fill="#a78bfa"/>
    <circle cx="600" cy="335" r="3" fill="#a78bfa"/>
    <circle cx="640" cy="335" r="3" fill="#a78bfa"/>
  </g>
</svg>